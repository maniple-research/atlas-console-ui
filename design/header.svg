<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="Atlas Console — Maniple Research design system">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&amp;family=JetBrains+Mono:wght@500;600&amp;family=Source+Serif+4:opsz,wght@8..60,600&amp;display=swap');
      .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .serif { font-family: 'Source Serif 4', Georgia, serif; }
      .text  { fill: #0F1119; }
      .dim   { fill: #8C95AB; }
      .muted { fill: #5A6178; }
      .azure { fill: #2C5BA0; }
    </style>
    <radialGradient id="glow" cx="100%" cy="0%" r="62%">
      <stop offset="0%"   stop-color="#2C5BA0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2C5BA0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0F1119" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ── Background ── -->
  <rect width="1600" height="600" fill="#F4F5F7"/>
  <rect width="1600" height="600" fill="url(#grid)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>

  <!-- ── Eyebrow ── -->
  <g transform="translate(96 96)">
    <!-- Maniple glyph: nested 45° squares -->
    <g transform="translate(10 10)">
      <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)" fill="none" stroke="#2C5BA0" stroke-width="1.8"/>
      <rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" fill="#2C5BA0"/>
    </g>
    <text x="40" y="15" class="mono azure" font-size="12" font-weight="600" letter-spacing="2.6">MANIPLE RESEARCH  ·  ATLAS CONSOLE  ·  shadcn theme + registry</text>
    <line x1="678" y1="10" x2="1408" y2="10" stroke="#B8C0CF" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- ── Headline ── -->
  <g transform="translate(96 290)">
    <text class="serif text" font-size="148" font-weight="600" letter-spacing="-4">Atlas</text>
    <text x="358" class="serif azure" font-size="148" font-weight="600" font-style="italic" letter-spacing="-4">Console</text>
  </g>

  <!-- ── Showcase strip ── -->
  <g transform="translate(96 432)">

    <!-- Palette cluster -->
    <text class="mono dim" font-size="10" font-weight="600" letter-spacing="2.4">CATEGORICAL PALETTE</text>
    <g transform="translate(0 16)">
      <rect width="60" height="60" fill="#2C5BA0"/>
      <rect x="68"  width="60" height="60" fill="#3E8B96"/>
      <rect x="136" width="60" height="60" fill="#6A5B9D"/>
      <rect x="204" width="60" height="60" fill="#B8843E"/>
      <rect x="272" width="60" height="60" fill="#607694"/>
    </g>
    <g transform="translate(0 96)" class="mono dim" font-size="9.5" font-weight="500" letter-spacing="1.4">
      <text x="0">#2C5BA0</text>
      <text x="68">#3E8B96</text>
      <text x="136">#6A5B9D</text>
      <text x="204">#B8843E</text>
      <text x="272">#607694</text>
    </g>

    <!-- Divider -->
    <line x1="372" y1="0" x2="372" y2="108" stroke="#D4D8E0" stroke-width="1"/>

    <!-- Status badges cluster -->
    <g transform="translate(400 0)">
      <text class="mono dim" font-size="10" font-weight="600" letter-spacing="2.4">STATUS LANGUAGE</text>
      <g transform="translate(0 24)" class="mono" font-size="10" font-weight="600" letter-spacing="1.6">
        <!-- OK -->
        <g>
          <rect width="98" height="24" fill="#2E8B5D" fill-opacity="0.10" stroke="#2E8B5D" stroke-opacity="0.28"/>
          <circle cx="12" cy="12" r="3" fill="#2E8B5D"/>
          <text x="22" y="16" fill="#2E8B5D">HEALTHY</text>
        </g>
        <!-- WARN -->
        <g transform="translate(108 0)">
          <rect width="108" height="24" fill="#B8830A" fill-opacity="0.12" stroke="#B8830A" stroke-opacity="0.32"/>
          <circle cx="12" cy="12" r="3" fill="#B8830A"/>
          <text x="22" y="16" fill="#B8830A">DEGRADED</text>
        </g>
        <!-- ERROR -->
        <g transform="translate(226 0)">
          <rect width="86" height="24" fill="#B8423D" fill-opacity="0.10" stroke="#B8423D" stroke-opacity="0.32"/>
          <circle cx="12" cy="12" r="3" fill="#B8423D"/>
          <text x="22" y="16" fill="#B8423D">FAILED</text>
        </g>
        <!-- ACTIVE -->
        <g transform="translate(322 0)">
          <rect width="76" height="24" fill="#2C5BA0" fill-opacity="0.05" stroke="#6FA5F0" stroke-opacity="0.32"/>
          <circle cx="12" cy="12" r="3" fill="#2C5BA0"/>
          <text x="22" y="16" fill="#2C5BA0">LIVE</text>
        </g>
      </g>

      <!-- Buttons -->
      <g transform="translate(0 70)" class="mono" font-size="10" font-weight="600" letter-spacing="2.0">
        <g>
          <rect width="156" height="32" fill="#2C5BA0"/>
          <text x="78" y="20" text-anchor="middle" fill="#FFFFFF">PROMOTE COHORT</text>
        </g>
        <g transform="translate(166 0)">
          <rect width="100" height="32" fill="transparent" stroke="#B8C0CF"/>
          <text x="50" y="20" text-anchor="middle" fill="#0F1119">PAUSE</text>
        </g>
      </g>
    </g>

    <!-- Divider -->
    <line x1="838" y1="0" x2="838" y2="108" stroke="#D4D8E0" stroke-width="1"/>

    <!-- Terminal plate sample -->
    <g transform="translate(868 0)">
      <text class="mono dim" font-size="10" font-weight="600" letter-spacing="2.4">TERMINAL PLATE</text>
      <g transform="translate(0 16)">
        <rect width="436" height="92" fill="#CCD3E0" stroke="#E8EAEF"/>
        <text x="14" y="22" class="mono dim" font-size="9.5" font-weight="500" letter-spacing="1.6">/var/log/atlas/ingest.log</text>
        <line x1="0" y1="30" x2="436" y2="30" stroke="#E8EAEF"/>
        <g class="mono" font-size="10.5" font-weight="500">
          <text x="14" y="50"><tspan class="dim">07:23:04Z</tspan> <tspan fill="#2E8B5D">INFO</tspan> <tspan class="text">worker.boot pid=4128</tspan></text>
          <text x="14" y="66"><tspan class="dim">07:23:04Z</tspan> <tspan fill="#B8830A">WARN</tspan> <tspan class="text">queue.backlog depth=2142</tspan></text>
          <text x="14" y="82"><tspan class="dim">07:23:05Z</tspan> <tspan fill="#B8423D">ERR </tspan> <tspan class="text">upstream.timeout host=api-04</tspan></text>
        </g>
      </g>
    </g>
  </g>
</svg>
